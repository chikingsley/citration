# SwiftLint configuration for the citration repo.
# Division of labor: SwiftLint enforces semantic and safety rules;
# all layout/formatting is owned by SwiftFormat (.swiftformat).
strict: true

excluded:
  - .build
  - .swiftpm
  - "**/.build"
  - "**/Package.resolved"
  - .swiftlint_cache
  - SourcePackages
  - DerivedData
  - Citration.xcworkspace

# Formatting rules owned by SwiftFormat — disabled here so the tools
# never fight. Do not re-enable without removing the SwiftFormat rule.
disabled_rules:
  - attribute_name_spacing
  - closing_brace
  - closure_parameter_position
  - colon
  - comma
  - comment_spacing
  - leading_whitespace
  - opening_brace
  - function_name_whitespace
  - return_arrow_whitespace
  - statement_position
  - switch_case_alignment
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_parameter_alignment
  - vertical_whitespace

opt_in_rules:
  # Crash prevention (high priority)
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unowned_variable_capture
  - fatal_error_message
  # Correctness
  - async_without_await
  - identical_operands
  - unneeded_throws_rethrows
  - overridden_super_call
  - redundant_nil_coalescing
  - yoda_condition
  # Idiomatic Swift
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - prefer_self_type_over_type_of_self
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  # Naming / organization
  - file_name

# Dead-code rules; run via `swiftlint analyze --compiler-log-path <log>`
# against a clean build log (too slow for every commit).
analyzer_rules:
  - unused_declaration
  - unused_import

# Deliberate multi-type grouping files; everything else must be named
# after a type it declares.
file_name:
  excluded:
    - main.swift
    - CitationModels.swift
    - LibraryModels.swift
    - LibraryRelationships.swift
    - MetadataModels.swift
    - DesignTokens.swift
    - AppModelTestSupport.swift

# Crash-risk rules — flag prominently
force_cast:
  severity: error
force_try:
  severity: error
force_unwrapping:
  severity: error
implicitly_unwrapped_optional:
  severity: error

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - i

line_length:
  warning: 150
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 200

file_length:
  warning: 500
  error: 1200

type_body_length:
  warning: 300
  error: 600

large_tuple:
  warning: 3
  error: 4

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 50

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3
