name: Zotero Self-Host

on:
  pull_request:
    paths:
      - "services/zotero-selfhost/**"
      - ".github/workflows/zotero-selfhost.yml"
      - "tools/sync-zotero-selfhost.sh"
      - "justfile"
  push:
    branches: [main]
    paths:
      - "services/zotero-selfhost/**"
      - ".github/workflows/zotero-selfhost.yml"
      - "tools/sync-zotero-selfhost.sh"
      - "justfile"

permissions:
  contents: read

defaults:
  run:
    working-directory: services/zotero-selfhost

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Install packed CLI
        run: |
          package_path="$(npm pack --silent)"
          install_root="$(mktemp -d)"
          npm install --prefix "$install_root" "$PWD/$package_path"
          "$install_root/node_modules/.bin/zotero-selfhost" --help
