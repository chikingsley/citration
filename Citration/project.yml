name: Citration
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.citration.app
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
packages:
  CitrationCore:
    path: ../CitrationCore
  Inject:
    url: https://github.com/krzysztofzablocki/Inject.git
    from: 1.5.2
targets:
  Citration:
    type: application
    platform: macOS
    info:
      path: Config/Citration-Info.plist
    sources:
      - path: Sources/Citration
    dependencies:
      - package: CitrationCore
      - package: Inject
    settings:
      base:
        PRODUCT_NAME: Citration
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          OTHER_LDFLAGS:
            - "$(inherited)"
            - -Xlinker
            - -interposable
          EMIT_FRONTEND_COMMAND_LINES: YES
schemes:
  Citration:
    build:
      targets:
        Citration: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
